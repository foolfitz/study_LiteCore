<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="pattern">
    <test name="lang" compare="eq"><string>zh-tw</string></test>
    <edit name="lang" mode="assign" binding="same"><langset><string>zh-tw</string></langset></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>zh-mo</string></test>
    <edit name="lang" mode="assign" binding="same"><langset><string>zh-mo</string></langset></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>zh-sg</string></test>
    <edit name="lang" mode="assign" binding="same"><langset><string>zh-sg</string></langset></edit>
  </match>
</fontconfig>
