http:
  routers:
    site:
      entrypoints: [https]
      rule: "PathPrefix(`/`)"
      service: web
      tls: {}
  services:
    web:
      loadBalancer:
        servers:
          - url: "http://web:80"
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik-certs/site.crt
        keyFile: /etc/traefik-certs/site.key
