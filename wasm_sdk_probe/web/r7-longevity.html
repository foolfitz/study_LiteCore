<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OxOffice R7-D Longevity Harness</title>
  <link rel="stylesheet" href="r7.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>R7-D Longevity Harness</h1>
      <p>公開 Document SDK lifecycle、crash/restart 與 finding 012 audit</p>
    </div>
    <span id="status" class="status-pill" role="status" aria-live="polite">loading</span>
  </header>
  <main>
    <section class="card">
      <dl class="metadata">
        <dt>Scenario</dt><dd id="scenario">—</dd>
        <dt>Cycle</dt><dd id="cycle">0</dd>
        <dt>Checkpoint</dt><dd id="checkpoint">loading</dd>
        <dt>Workers</dt><dd id="workers">0</dd>
        <dt>Handles</dt><dd id="handles">0</dd>
        <dt>Decision</dt><dd id="decision">—</dd>
      </dl>
    </section>
    <section class="card"><pre id="log" class="log" aria-label="R7-D machine log"></pre></section>
  </main>
  <script type="module" src="r7-longevity-app.js"></script>
</body>
</html>
