<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R8-C Release Update Reference</title>
  <link rel="stylesheet" href="./r7.css">
</head>
<body>
  <main>
    <h1>R8-C Release Update Reference</h1>
    <p id="status" role="status">starting</p>
    <p id="release-state">current: none; candidate: none; online: unknown</p>
    <div class="toolbar">
      <button id="retry" type="button">Retry</button>
      <button id="continue" type="button">Continue current</button>
      <button id="reload" type="button">Reload to update</button>
      <button id="rollback" type="button">Rollback</button>
    </div>
    <canvas id="tile" width="256" height="256"></canvas>
    <pre id="log"></pre>
  </main>
  <script type="module" src="./r8-update-app.js"></script>
</body>
</html>
