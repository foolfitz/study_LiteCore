<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R8-B Verified Delivery</title>
  <style>
    body { font: 14px/1.45 system-ui, sans-serif; margin: 1.25rem; color: #17212b; }
    h1 { font-size: 1.35rem; }
    #status { padding: .6rem; background: #eef4fa; border-radius: .35rem; }
    #tile { margin-top: 1rem; max-width: 320px; border: 1px solid #9aa8b5; }
    #log { white-space: pre-wrap; max-height: 24rem; overflow: auto; background: #101820;
      color: #d9e7f2; padding: .75rem; border-radius: .35rem; }
  </style>
</head>
<body>
  <h1>R8-B Verified Delivery</h1>
  <p id="status" role="status" aria-live="polite">starting</p>
  <canvas id="tile" width="1" height="1" aria-label="verified document first tile"></canvas>
  <pre id="log"></pre>
  <script type="module" src="./r8-delivery-app.js"></script>
</body>
</html>
