  <p>出貨的 worker 不能改（判定綁著它的雜湊），也不需要改：一次點擊在頁面上本來就有
     <strong>兩個</strong>可觀測的時刻——點擊請求回來的時候，以及游標失效回呼到達的

     這三個數字就把 22 ms 切成「我們的傳輸」與「引擎那一側」。
