  <h1>046 — 選取過頭到底涵蓋多遠</h1>
  <p>讀回那一輪只在<strong>一份語料的一個位置</strong>上量到「空段落上
     <code>.uno:SelectText</code> 會把下一段也選進來」。一個位置不是刻畫。
     這一頁的關鍵格是 <code>text-end</code>：finding 034 說舊的選取對是因為
     <strong>游標在段落邊界</strong>才逃到鄰段的，而空段落正是「兩個邊界同時成立」。
     所以——<strong>有文字的段落，游標放在最後面，會不會也選過頭？</strong>
     會的話這就是一個日常手勢上的缺陷。全程在凍結的引擎上（診斷 profile 的
     wasm 與出貨逐位元相同）。判準寫在
     <code>findings/evidence/046/overshoot/PREDICTION.md</code>。這一頁不判定。</p>
