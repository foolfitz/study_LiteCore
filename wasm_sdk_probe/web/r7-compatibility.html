<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OxOffice R7-C Compatibility Harness</title>
  <link rel="stylesheet" href="r7.css">
</head>
<body>
  <header class="app-header">
    <div><h1>R7-C ODT-first Compatibility Harness</h1><p>逐檔 manifest gate；DOCX 明確 typed unsupported</p></div>
    <span id="status" class="status-pill" role="status" aria-live="polite">loading</span>
  </header>
  <main>
    <section class="card">
      <dl class="metadata">
        <dt>Group</dt><dd id="group">—</dd>
        <dt>Current</dt><dd id="current">—</dd>
        <dt>Completed</dt><dd id="completed">0</dd>
        <dt>Decision</dt><dd id="decision">—</dd>
      </dl>
    </section>
    <section class="card"><pre id="log" class="log" aria-label="R7-C machine log"></pre></section>
  </main>
  <script type="module" src="r7-compatibility-app.js"></script>
</body>
</html>
